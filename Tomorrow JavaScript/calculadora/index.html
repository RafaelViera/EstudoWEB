<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Trabalho final I</title>
        <link rel="stylesheet" href="/Tomorrow JavaScript/calculadora/styles.css">
        <script src="/Tomorrow JavaScript/calculadora/script.js"></script>

        <style>
            .red {
                background-color: #800080;
            }

        </style>
    </head>

    <body id="body">
        <h1 id="head">Bem-vindo à Calculadora</h1>
        
        <div id="entrada-valores">
            <label for="primeiro-valor">Primeiro Valor:</label>
            <input name="primeiro-valor" id="primeiro-valor" text="">

            <p></p>
            <label for="segundo-valor">Segundo Valor:</label>
            <input name="segundo-valor" id="segundo-valor" text=""></input>
        </div> 

        <p></p>
        <label for="opcoes-calculo">Escolha uma das seguinte opções</label>
        <select name="opcoes-calculo" id="opcoes-calculo">
            <option value="somar">Somar</option>
            <option value="subtrair">Subtrair</option>
            <option value="multiplicar">Multiplicar</option>
            <option value="dividir">Dividir</option>
        </select>

        <p></p>
        <button onclick="calcular()">Calcular</button>
        <button onclick="limpar()">Limpar</button>

        <div id="saida-valores">
            <p></p>
            <label for="saida-resposta">Resposta:</label>
            <p name="saida-resposta" id="saida-resposta">ex: 01</p>
        </div>

        <footer>
            <div class="red" id="informacoes">
                <p>Idealizador: Rafael Rocha</p>
                <p>Designer: Rafael Rocha</p>
                <p>Programador: Rafael Rocha</p>
                <p>Eq. Marketing: Rafael Rocha</p>
                <p>Social Media: Rafael Rocha</p>
                <p>Faz-Tudo: Rafael Rocha</p>
            </div>

            <p style="text-align: center; font-size: 130%;">Agradeço a preferencia</p>

            <img src="./img/download.jpeg">
        </footer>
    </body>
</html>
